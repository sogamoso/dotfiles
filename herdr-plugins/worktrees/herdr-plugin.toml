# Paseo-style worktree workspaces: a new checkout follows the repo's paseo.json,
# and a pull request opens as a workspace of its own. Linked from this checkout
# by install/dotfiles/herdr-plugins.sh.
id = "dotfiles.worktrees"
name = "Worktrees"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "Run paseo.json setup in new worktrees and open pull requests as worktree workspaces"
platforms = ["linux", "macos"]

# Every new checkout, whether hrw, open-pr or herdr's sidebar made it
[[events]]
on = "worktree.created"
command = ["bash", "created.sh"]

# Ctrl-click on a pull request link, or prefix+u for the picker
[[actions]]
id = "open-pr"
title = "Open a pull request in its own worktree"
command = ["bash", "open-pr.sh"]

[[panes]]
id = "pr-picker"
title = "Pull requests"
placement = "popup"
width = "80%"
height = "60%"
command = ["bash", "pick-pr.sh"]

[[link_handlers]]
id = "github-pr"
title = "Open pull request in its own worktree"
pattern = "^https://github\\.com/[^/]+/[^/]+/pull/[0-9]+([/?#].*)?$"
action = "open-pr"
