name: Brewfile

# Every Brewfile entry still resolves in Homebrew. Casks get renamed, disabled
# or pulled upstream with no commit here, so this runs weekly as well as when
# the Brewfile changes. A failed scheduled run emails whoever last edited the
# schedule below.
on:
  push:
    paths:
      - Brewfile
      - .github/check-brewfile-names.sh
      - .github/workflows/brewfile.yml
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Look up every formula and cask
        run: .github/check-brewfile-names.sh
