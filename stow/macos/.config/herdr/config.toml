# Set by herdr itself when the first-run tour is dismissed. Root-level, so it
# has to stay above the first table header.
onboarding = false

# herdr keybindings, mapped to mirror the tmux muscle memory this replaces.
# Ghostty translates the physical Command key into Meta/Alt escape sequences
# (cmd+1 -> alt+1, cmd+left -> alt+left, ctrl+cmd+left -> ctrl+alt+left), so the
# no-prefix Cmd navigation from tmux arrives here as alt+... / ctrl+alt+... chords.
[keys]
# tmux primary prefix was C-Space; herdr's default is ctrl+b. Only one prefix exists.
prefix = "ctrl+space"

# Tabs = tmux windows. Keep herdr's prefix defaults and layer the Cmd chords on top.
switch_tab   = "prefix+1..9"
# Each agent has a workspace of its own, usually with a single tab, so Cmd+1..9
# goes to the agents instead: agent N in the agents panel, in workspace order.
focus_agent  = "alt+1..9"                   # Cmd+1..9 -> jump to agent
previous_tab = ["prefix+p", "alt+left"]     # Cmd+Left  -> previous tab
next_tab     = ["prefix+n", "alt+right"]    # Cmd+Right -> next tab

# Workspaces = tmux sessions.
previous_workspace = ["prefix+shift+p", "alt+up"]    # Cmd+Up   -> previous workspace
next_workspace     = ["prefix+shift+n", "alt+down"]  # Cmd+Down -> next workspace

# Directional pane focus, matching the Ctrl+Cmd+arrows used in tmux. No prefix+h/j/k/l:
# Omarchy binds prefix+h to split and prefix+k to close tab, so the habit would cross over.
focus_pane_left  = "ctrl+alt+left"
focus_pane_down  = "ctrl+alt+down"
focus_pane_up    = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"

# Omarchy parity: Ctrl+Cmd+Shift+arrows resize, Cmd+Shift+Left/Right move the tab.
resize_pane_left  = "ctrl+alt+shift+left"
resize_pane_down  = "ctrl+alt+shift+down"
resize_pane_up    = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"
move_tab_previous = "alt+shift+left"
move_tab_next     = "alt+shift+right"

# A new review agent on its own worktree (hrw from layouts.zsh), for the repo the
# focused pane is in. A popup rather than a detached shell, so a failure stays on
# screen until a key is pressed; on success it closes on its own.
[[keys.command]]
key = "prefix+a"
type = "popup"
command = "\"$SHELL\" -ic 'cd \"$HERDR_ACTIVE_PANE_CWD\" && hrw || read -r _'"
description = "new agent on its own worktree (hrw)"

# The same, after asking which agent, what task to start it on, and the branch.
[[keys.command]]
key = "prefix+shift+a"
type = "popup"
command = "\"$SHELL\" -ic 'cd \"$HERDR_ACTIVE_PANE_CWD\" && hra || read -r _'"
description = "new agent on a task (hra)"

# Finish the focused agent: confirm, then delete its branch and worktree (hrd).
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "\"$SHELL\" -ic 'hrd || read -r _'"
description = "finish agent, removing its worktree and branch (hrd)"

# Paste a pull request, an issue or a branch and get a worktree with an agent
# on it, from mkdir700/herdr-plugin-worktree (pinned in install/lib). Ctrl-
# clicking a pull request link runs the same flow, through herdr-plugins/.
[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "worktree.create"
description = "worktree from a pull request, issue or branch"

# The focused pane's pull request in terminal-browser, in a popup, so there's
# only one and it closes (Ctrl+Q) before anything else
[[keys.command]]
key = "prefix+shift+u"
type = "popup"
command = "\"$HOME/.config/herdr/scripts/pr-open.sh\""
description = "open this branch's pull request in terminal-browser"
width = "90%"
height = "90%"

[theme]
name = "tokyo-night"

# Match the exact Tokyo Night blue used in the tmux status line.
[theme.custom]
accent = "#7aa2f7"

[ui]
# The automatic rename plugin names tabs, and treats a name typed here as one
# chosen by hand, which it then leaves alone. Omarchy's config sets it too.
prompt_new_tab_name = false
status_indicators = "symbols"
show_agent_labels_on_pane_borders = false
agent_panel_sort = "spaces"
# Counts open pull requests by status, and tags each workspace with its own
# (the $pr row below). The script lives in the cross-platform herdr stow package.
tab_bar_right = [
  { type = "command", command = "\"$HOME/.config/herdr/scripts/pr-status.sh\"", interval_seconds = 30, timeout_seconds = 20 },
]

# herdr's default rows, plus the workspace's pull request: green once it's
# ready to merge, orange while checks run or it waits on review, red when
# something has to change first
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  [{ token = "$pr", rules = [{ contains = "passed", fg = "#9ece6a" }, { contains = "running", fg = "#ff9e64" }, { contains = "blocked", fg = "#f7768e", bold = true }] }],
]

[ui.sound]
enabled = false

[ui.toast]
delivery = "system"
