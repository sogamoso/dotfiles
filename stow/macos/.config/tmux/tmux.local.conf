# Personal overrides layered on top of Omarchy's tmux config, which tmux.conf
# copies and sources this from on its last line.

# Tokyo Night theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[bg=default] "
set -g status-right "#[fg=#7aa2f7]#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#444b6a]#h "
set -g window-status-format "#[fg=#444b6a] #I:#W "
set -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "
set -g pane-border-style "fg=#32344a"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=default,fg=#7aa2f7"
set -g message-command-style "bg=default,fg=#7aa2f7"
set -g mode-style "bg=#7aa2f7,fg=#1a1b26"
setw -g clock-mode-colour "#7aa2f7"

# Pass through extended keys (e.g., Shift+Return for Claude Code multi-line input)
set -g extended-keys on

# Copy to system clipboard
set -s copy-command "pbcopy"

# Explicit zoom toggle
bind z resize-pane -Z

# Window switching — Omarchy's Alt+N on Cmd+N
# (physical Command key = ALT role on Omarchy)
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# Window navigation — Omarchy's Alt+Left/Right on Cmd+Left/Right
bind -n M-Left previous-window
bind -n M-Right next-window

# Session navigation — Omarchy's Alt+Up/Down on Cmd+Up/Down
bind -n M-Up switch-client -p
bind -n M-Down switch-client -n
